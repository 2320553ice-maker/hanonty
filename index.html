  /* ===== MAGIC ELEMENTS ===== */
  #magic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .floating-element { position: absolute; opacity: 0.5; animation: floatAnim var(--d) infinite ease-in-out; }
  @keyframes floatAnim { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-50px) rotate(180deg); } }

  /* ===== RESPONSIVE HERO ===== */
  .hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 10;
  }

  .hero-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 10% 5%;
    border-radius: 40px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
    width: 100%;
    max-width: 800px;
  }

  .hero h1 { font-family: 'Amiri', serif; font-size: clamp(2.5rem, 8vw, 5rem); color: var(--light-gold); margin-bottom: 20px; }
  .hero p { font-size: clamp(1.2rem, 4vw, 2.2rem); color: var(--pink); font-weight: 900; }

  /* ===== RESPONSIVE MESSAGES ===== */
  .messages-section { padding: 80px 5%; max-width: 1200px; margin: 0 auto; position: relative; z-index: 10; }
  .section-title { font-family: 'Amiri', serif; font-size: clamp(2rem, 6vw, 3.5rem); color: var(--light-gold); text-align: center; margin-bottom: 40px; }

  .messages-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

  .message-card {
    background: var(--glass);
    backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    padding: 30px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    text-align: center;
  }

  .message-card:hover { transform: translateY(-10px); border-color: var(--pink); }
  .message-card i { font-size: 2.5rem; color: var(--pink); display: block; margin-bottom: 15px; }
  .message-card span { font-weight: 900; font-size: 1.3rem; }

  /* ===== RESPONSIVE GAME ===== */
  .game-section { padding: 80px 5%; text-align: center; position: relative; z-index: 10; }
  #game-frame {
    display: inline-block; padding: 8px; background: linear-gradient(45deg, var(--deep-pink), var(--gold));
    border-radius: 25px; box-shadow: 0 0 40px rgba(224, 96, 128, 0.4);
    max-width: 100%;
  }
  #gameCanvas { 
    border-radius: 20px; background: #000; display: block; 
    max-width: 100%; height: auto; 
  }

  .game-controls {
    display: none; /* Only show on touch devices */
    margin-top: 20px;
    justify-content: center;
    gap: 20px;
  }

  @media (pointer: coarse) { .game-controls { display: flex; } }

  .control-btn {
    width: 60px; height: 60px; background: var(--glass); border: 2px solid var(--pink);
    border-radius: 50%; color: white; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
    user-select: none;
  }

  .btn {
    background: linear-gradient(45deg, var(--deep-pink), var(--purple-pink));
    color: white; border: none; padding: 15px 40px; border-radius: 50px;
    font-family: 'Tajawal', sans-serif; font-weight: 900; font-size: 1.1rem;
    cursor: pointer; margin-top: 30px;
  }

  /* ===== MODAL ===== */
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal.active { display: flex; }
  .modal-content {
    background: #1a0a10; border: 2px solid var(--pink);
    padding: 40px 20px; border-radius: 35px; max-width: 550px; width: 100%; text-align: center;
    position: relative;
  }
  .close-modal { position: absolute; top: 15px; right: 15px; font-size: 2rem; cursor: pointer; color: var(--pink); }

  @media (max-width: 600px) {
    .hero-card { padding: 40px 20px; }
    .messages-grid { grid-template-columns: 1fr; }
  }

</style>
</head>
<body>

<div id="magic-bg"></div>

<section class="hero">
  <div class="hero-card">
    <h1>عيد أضحى مبارك</h1>
    <p>يا أغلى هنونتي في الدنيا</p>
    <div style="font-family: 'Amiri', serif; font-size: clamp(1.5rem, 4vw, 2.5rem); color: var(--gold); margin-top: 20px;">تقبل الله منا ومنكم صالح الأعمال</div>
  </div>
</section>

<section class="messages-section">
  <h2 class="section-title">رسائل العيد ✨</h2>
  <div class="messages-grid">
    <div class="message-card" onclick="openMsg(0)"><i>🌟</i><span>رسالة حب</span></div>
    <div class="message-card" onclick="openMsg(1)"><i>🌙</i><span>تهنئة غالية</span></div>
    <div class="message-card" onclick="openMsg(2)"><i>✨</i><span>دعوة حلوة</span></div>
    <div class="message-card" onclick="openMsg(3)"><i>🎈</i><span>فرحة العيد</span></div>
    <div class="message-card" onclick="openMsg(4)"><i>🎁</i><span>أحلى لمة</span></div>
    <div class="message-card" onclick="openMsg(5)"><i>❤️</i><span>بركة العيد</span></div>
  </div>
</section>

<section class="game-section">
  <h2 class="section-title">العب مع هنونتي 🎮</h2>
  <div id="game-frame">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
  </div>
  <div class="game-controls">
    <div class="control-btn" id="btnLeft">◀</div>
    <div class="control-btn" id="btnJump">▲</div>
    <div class="control-btn" id="btnRight">▶</div>
  </div>
  <br>
  <button class="btn" onclick="initGame()">العب تاني</button>
</section>

<div id="msgModal" class="modal" onclick="closeMsg()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <span class="close-modal" onclick="closeMsg()">&times;</span>
    <p id="msgText" style="font-size: clamp(1.2rem, 4vw, 1.8rem); line-height: 1.6;"></p>
  </div>
</div>

<script>
  // Magic Background
  const bg = document.getElementById('magic-bg');
  const items = ['✨', '🦋', '🌸', '💖'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'floating-element';
    el.innerText = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + '%'; el.style.top = Math.random() * 100 + '%';
    el.style.fontSize = Math.random() * 15 + 15 + 'px';
    el.style.setProperty('--d', Math.random() * 8 + 4 + 's');
    bg.appendChild(el);
  }

  const messages = [
    "حبايبنا الغاليين، يا رب عيدكم يبقى كله فرحة وضحك وربنا يديمكم لينا دايماً منورين حياتنا.",
    "كل سنة وانتم طيبين يا أحلى ناس، العيد ما يكملش غير بلمتكم وضحكتكم الصافية، عيد سعيد عليكم!",
    "يا رب العيد ده يفتح ليكم أبواب الخير كلها، ويحقق لكم كل اللي بتتمنوه، عيد أضحى مبارك يا غاليين.",
    "أجمل تهنئة لأغلى ناس على قلبي، ربنا يجعل أيامكم كلها أعياد ويرزقكم السعادة والرضا دايماً.",
    "العيد فرحة وأجمل فرحة هي وجودكم معانا، كل سنة وانتم منورين الدنيا وبألف خير وصحة وسعادة.",
    "عيد سعيد عليكم وعلى كل حبايبكم، يا رب يملأ بيوتكم بركة وفرحة، ويتقبل منكم صالح الأعمال."
  ];

  function openMsg(i) {
    document.getElementById('msgText').innerText = messages[i];
    document.getElementById('msgModal').classList.add('active');
  }
  function closeMsg() { document.getElementById('msgModal').classList.remove('active'); }

  // ===== RESPONSIVE GAME LOGIC =====
  const canvas = document.getElementById('gameCanvas');

  let state = {};
  const keys = {};
  const mobileState = { left: false, right: false, jump: false };

  function initGame() {
    state = {
      player: { x: 175, y: 500, w: 50, h: 50, vx: 0, vy: 0, speed: 6, jump: -14, gravity: 0.55, onGround: false },
      platforms: [], score: 0, active: true, scrollSpeed: 0.6
    };
    for(let i=0; i<8; i++) addPlatform(550 - i * 110);
    state.platforms.push({ x: 0, y: 585, w: canvas.width, h: 20 });
  }

  function addPlatform(y) {
    const w = 110 + Math.random() * 90;
    const x = Math.random() * (canvas.width - w);
    state.platforms.push({ x, y, w, h: 18 });
  }

  // Controls
  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);

  const setupBtn = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); mobileState[key] = true; });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); mobileState[key] = false; });
  };
  setupBtn('btnLeft', 'left'); setupBtn('btnRight', 'right'); setupBtn('btnJump', 'jump');

  function update() {
    if (!state.active) return;
    const p = state.player;
    if (keys['ArrowLeft'] || mobileState.left) p.vx = -p.speed;
    else if (keys['ArrowRight'] || mobileState.right) p.vx = p.speed;
    else p.vx *= 0.8;

    if ((keys['ArrowUp'] || keys['Space'] || mobileState.jump) && p.onGround) {
      p.vy = p.jump; p.onGround = false;
    }

    p.vy += p.gravity; p.x += p.vx; p.y += p.vy;
    if (p.x < -p.w) p.x = canvas.width; if (p.x > canvas.width) p.x = -p.w;

    p.onGround = false;
    state.platforms.forEach(plat => {
      if (p.vy > 0 && p.x + p.w > plat.x && p.x < plat.x + plat.w && p.y + p.h > plat.y && p.y + p.h < plat.y + plat.h + p.vy) {
        p.y = plat.y - p.h; p.vy = 0; p.onGround = true;
      }
    });

    if (p.y < canvas.height / 2) {
      let diff = canvas.height / 2 - p.y; p.y = canvas.height / 2;
      state.platforms.forEach(pl => pl.y += diff); state.score += Math.floor(diff / 5);
    }
    if (state.score > 50) {
      state.scrollSpeed = 0.6 + (state.score / 1000);
      state.platforms.forEach(pl => pl.y += state.scrollSpeed); p.y += state.scrollSpeed;
    }
    if (state.platforms[state.platforms.length-1].y > 0) addPlatform(state.platforms[state.platforms.length-1].y - 110);
    state.platforms = state.platforms.filter(pl => pl.y < canvas.height + 50);
    if (p.y > canvas.height) state.active = false;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0, '#0d0515'); g.addColorStop(1, '#1a0a10');
    ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width, canvas.height);

    state.platforms.forEach(pl => {
      ctx.fillStyle = '#f7b8c8'; ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, pl.h, 10); ctx.fill();
    });

    const p = state.player;
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, p.w/2, 0, Math.PI*2); ctx.clip();
    if (faceImg.complete) ctx.drawImage(faceImg, p.x, p.y, p.w, p.h); else { ctx.fillStyle = '#f7b8c8'; ctx.fill(); }
    ctx.restore();

    ctx.fillStyle = '#2a1a2e'; ctx.fillRect(p.x + 5, p.y - 6, p.w - 10, 8); ctx.fillRect(p.x - 2, p.y - 10, p.w + 4, 4);

    ctx.fillStyle = '#f0d080'; ctx.font = 'bold 24px Tajawal'; ctx.textAlign = 'right';
    ctx.fillText(`⭐ ${state.score}`, canvas.width - 20, 45);

    if (!state.active) {
      ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,canvas.width, canvas.height);
      ctx.fillStyle = '#e06080'; ctx.font = 'bold 35px Tajawal'; ctx.textAlign = 'center';
      ctx.fillText('وقعنا يا بطلة!', canvas.width/2, canvas.height/2);
    }
    requestAnimationFrame(() => { update(); draw(); });
  }
  initGame(); faceImg.onload = draw;
</script>
